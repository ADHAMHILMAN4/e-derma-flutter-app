name: e_derma
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"




dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.5  # Use the latest version
  firebase_auth: ^5.5.1
  flutter_map: ^6.0.0  # Ensure latest version
  geolocator: ^11.0.0   # For getting user location
  latlong2: ^0.9.0  # Required by flutter_map
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  google_maps_flutter: ^2.12.0
  geocoding: ^3.0.0
  http: ^1.3.0
  permission_handler: ^11.0.1
  mapbox_maps_flutter: ^2.7.0
  image_picker: ^1.0.7
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  url_launcher: ^6.2.1
  flutter_stripe: ^11.4.0
  webview_flutter: ^4.2.0
  fl_chart: ^0.66.1
  charts_flutter_new: ^0.12.0
  flutter_local_notifications: 15.1.1
  pdf: ^3.10.4
  path_provider: ^2.1.1
  open_file: ^3.3.2









dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Lato-Bold.ttf
    - assets/images/loginbackground.png
    - assets/default_profile_image.png
    - assets/mapbox_config.json
    - assets/images/ewallets/grabpay2.png
    - assets/images/ewallets/touchngo.png
    - assets/images/ewallets/shopeepay.png
    - assets/images/ewallets/boost.png

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700


 